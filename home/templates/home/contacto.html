{% extends 'base.html' %}

{% block title %}Contacto - Pixel-Vault{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-zinc-900 p-8 rounded-2xl shadow-2xl border border-violet-900/30">
    <h2 class="text-2xl font-bold text-white mb-2 flex items-center gap-2">📬 Contáctanos</h2>
    <p class="text-zinc-400 text-sm mb-6">¿Tenés alguna duda sobre un juego o tu compra? Escribinos y te respondemos al toque.</p>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div>
            <label class="block text-sm font-medium text-zinc-300 mb-1">Tu Nombre</label>
            <input type="text" name="nombre" required class="w-full bg-zinc-950 border border-violet-900/40 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-violet-500 transition">
        </div>
        <div>
            <label class="block text-sm font-medium text-zinc-300 mb-1">Correo Electrónico</label>
            <input type="email" name="email" required class="w-full bg-zinc-950 border border-violet-900/40 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-violet-500 transition">
        </div>
        <div>
            <label class="block text-sm font-medium text-zinc-300 mb-1">Mensaje</label>
            <textarea name="mensaje" rows="4" required class="w-full bg-zinc-950 border border-violet-900/40 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-violet-500 transition"></textarea>
        </div>
        <button type="submit" class="w-full bg-violet-600 hover:bg-violet-500 text-white font-bold py-3 rounded-lg transition duration-200 shadow-lg shadow-violet-900/30">
            Enviar Mensaje
        </button>
    </form>
</div>
{% endblock %}
